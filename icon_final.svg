<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0B132B"/>
    </linearGradient>

    <linearGradient id="warehouseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <linearGradient id="warehouseSideGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>

    <linearGradient id="arrowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.45"/>
    </filter>

    <filter id="arrowGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#10B981" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Основа иконки -->
  <rect width="512" height="512" rx="112" ry="112" fill="url(#bgGrad)"/>
  <rect x="2" y="2" width="508" height="508" rx="110" ry="110" fill="none" stroke="#334155" stroke-width="2" opacity="0.6"/>

  <g filter="url(#shadow)">
    <!-- Главный корпус склада: плоская крыша с невысоким скатом (промышленный силуэт, не "домик") -->
    <path d="M 108 260 L 108 366 L 320 366 L 320 260 L 214 208 Z" fill="url(#warehouseGrad)"/>
    <!-- Боковой пристрой ниже -->
    <path d="M 320 285 L 320 366 L 412 366 L 412 285 L 366 258 Z" fill="url(#warehouseSideGrad)"/>

    <!-- Роллетные ворота на главном корпусе -->
    <rect x="150" y="296" width="88" height="70" rx="6" fill="#1F2937" opacity="0.92"/>
    <line x1="150" y1="312" x2="238" y2="312" stroke="#0F172A" stroke-width="4" opacity="0.6"/>
    <line x1="150" y1="329" x2="238" y2="329" stroke="#0F172A" stroke-width="4" opacity="0.6"/>
    <line x1="150" y1="346" x2="238" y2="346" stroke="#0F172A" stroke-width="4" opacity="0.6"/>

    <!-- Малые ворота на пристрое -->
    <rect x="340" y="312" width="48" height="54" rx="5" fill="#1F2937" opacity="0.85"/>
    <line x1="340" y1="326" x2="388" y2="326" stroke="#0F172A" stroke-width="3" opacity="0.6"/>
    <line x1="340" y1="340" x2="388" y2="340" stroke="#0F172A" stroke-width="3" opacity="0.6"/>

    <!-- Стрелка финансового роста, проходящая сквозь силуэт склада -->
    <path d="M 88 340 L 178 268 L 246 302 L 372 152 L 328 152 L 420 130 L 398 222 L 364 176 L 248 322 L 178 288 L 88 360 Z"
          fill="url(#arrowGrad)" filter="url(#arrowGlow)"/>
  </g>
</svg>
